<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async JS</title>
</head>
<body>
    <h1>Chai aur Code</h1>
    <button id="stop">Stop</button>

    <script>
        //setInterval()  - It is asking a break point.
        const Hacx = (() => {
            console.log("Hacx");
        })
        const ChangeText = (() => {
            document.getElementsByTagName('h1').innerHTML = 'Hacx the Cybersecurity Engineer'
        })
        setTimeout(ChangeText, 3000)
    </script>
</body>
</html>
