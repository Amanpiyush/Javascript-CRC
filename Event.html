<script>
  function countRabbits() {
    for(let i=1; i<=3; i++) {
      alert("Rabbit number " + i);
    }
  }
</script>

<input type="button" onclick="countRabbits()" value="Count rabbits!">


<script>

    const Rabbit = ((Count) => {
        for(let i=1;i<=3;i++){
            alert(`The Rabbit Count is ${i}`);
        }
    })

</script>

<input type="button" value="Rabbit Count!!!" onclick="Rabbit()">
